<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu | {{restaurant.name}} — Build Yo! Own Bowl &amp; Mifen</title>
<meta name="description" content="Browse the full {{restaurant.name}} menu — Build Yo! Own Bowl, signature Mifen bowls, appetizers, drinks, desserts and our new Yo! Bowl Snacks. Order online for carryout.">
<link rel="canonical" href="{{site.base_url}}/Menu.html">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{restaurant.name}}">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="{{site.base_url}}/Menu.html">
<meta property="og:title" content="Menu | {{restaurant.name}} — Build Yo! Own Bowl &amp; Mifen">
<meta property="og:description" content="Build Yo! Own Bowl, signature Mifen bowls, appetizers, drinks, desserts and Yo! Bowl Snacks. Order online for carryout.">
<meta property="og:image" content="{{site.base_url}}/menu-photo/main-menu.webp">
<meta property="og:image:alt" content="{{restaurant.name}} full menu">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Menu | {{restaurant.name}}">
<meta name="twitter:description" content="Build Yo! Own Bowl, signature Mifen bowls, appetizers and more. Order online for carryout.">
<meta name="twitter:image" content="{{site.base_url}}/menu-photo/main-menu.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{media.google_fonts_url}}" rel="stylesheet">
<script>document.documentElement.className += ' js';</script>
<link rel="stylesheet" href="css/styles.css?v=2">
<link rel="stylesheet" href="css/theme.css">

<!-- ===== Structured data: Menu (Schema.org JSON-LD) ===== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Menu",
  "@id": "{{site.base_url}}/#menu",
  "name": "{{restaurant.name}} Menu",
  "url": "{{site.base_url}}/Menu.html",
  "inLanguage": "en-US",
  "hasMenuSection": [
    {
      "@type": "MenuSection",
      "name": "Build Yo! Own Bowl",
      "description": "Customize your own bowl with your choice of base, protein and toppings.",
      "hasMenuItem": [
        { "@type": "MenuItem", "name": "Build Yo! Own Bowl", "description": "Pick your noodles or rice, protein and toppings — add pickled beans, Thai chili, fried egg and more." }
      ]
    },
    {
      "@type": "MenuSection",
      "name": "Signature Bowls",
      "hasMenuItem": [
        { "@type": "MenuItem", "name": "Braised Beef Mifen", "description": "Tender braised beef over rice noodles in a rich, spicy broth." },
        { "@type": "MenuItem", "name": "Signature Dry Mifen", "description": "Our signature dry-style rice noodles with savory, spicy seasoning." },
        { "@type": "MenuItem", "name": "Dry Mifen with Fish", "description": "Spicy dry rice noodles topped with fish." }
      ]
    },
    {
      "@type": "MenuSection",
      "name": "Appetizers",
      "hasMenuItem": [
        { "@type": "MenuItem", "name": "Dumplings" },
        { "@type": "MenuItem", "name": "Wontons in Chili Oil" },
        { "@type": "MenuItem", "name": "Cucumber Salad" }
      ]
    },
    {
      "@type": "MenuSection",
      "name": "Drinks & Desserts",
      "hasMenuItem": [
        { "@type": "MenuItem", "name": "Fresh Yogurt" },
        { "@type": "MenuItem", "name": "Hibiscus Tea" }
      ]
    },
    {
      "@type": "MenuSection",
      "name": "Yo! Bowl Snacks",
      "description": "Our new lineup of grab-and-go snacks."
    }
  ]
}
</script>
<style>
  .menu-board { display: flex; flex-direction: column; gap: 32px; margin-top: 8px; }
  .menu-board figure { margin: 0; }
  .menu-board img {
    display: block; width: 100%; height: auto;
    border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--line);
  }
  .menu-board .menu-snacks { width: 50%; margin: 0 auto; }
</style>
</head>
<body>

{{> nav}}

<div class="page-head" data-screen-label="Menu page head">
  <p class="section-eyebrow">Come Hungry</p>
  <h1>Build Yo! Own Bowl &amp; more</h1>
  <p>Come hungry — here's everything we're serving up.</p>
</div>

<section data-screen-label="Menu">
  <div class="wrap center">
    <div class="menu-board">
      <figure class="menu-main" data-reveal>
        <img src="menu-photo/main-menu.webp" alt="{{restaurant.name}} full menu — Build Yo! Own Bowl, signature bowls, appetizers, drinks and desserts" fetchpriority="high" decoding="async">
      </figure>
      <figure class="menu-snacks" data-reveal>
        <img src="menu-photo/snacks-menu.webp" alt="{{restaurant.name}} new Yo! Bowl Snacks menu" loading="lazy" decoding="async">
      </figure>
    </div>
    <div class="center" style="margin-top:44px" data-reveal>
      <a class="btn btn--lg" href="{{links.order_online}}" target="_blank" rel="noopener">Order Online</a>
    </div>
  </div>
</section>

{{> footer}}
</body>
</html>
