<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catering | {{restaurant.name}} — Food for Events</title>
<meta name="description" content="{{pages.catering.meta_description}}">
<link rel="canonical" href="{{site.base_url}}/Catering.html">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{restaurant.name}}">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="{{site.base_url}}/Catering.html">
<meta property="og:title" content="Catering | {{restaurant.name}} — Food for Events">
<meta property="og:description" content="{{pages.catering.og_description}}">
<meta property="og:image" content="{{media.og_image}}">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta property="og:image:alt" content="{{restaurant.name}} catering">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Catering | {{restaurant.name}}">
<meta name="twitter:description" content="{{pages.catering.og_description}}">
<meta name="twitter:image" content="{{media.og_image}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{media.google_fonts_url}}" rel="stylesheet">
<script>document.documentElement.className += ' js';</script>
<link rel="stylesheet" href="css/styles.css?v=2">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

{{> nav}}

<section class="catering-hero" data-screen-label="Catering hero"
  style="background-image:linear-gradient(rgba(36,28,24,.78),rgba(36,28,24,.78)),url('{{media.hero_bg}}');background-size:cover;background-position:center;">
  <p class="section-eyebrow">Catering</p>
  <h1>{{pages.catering.h1}}</h1>
  <p style="max-width:560px;margin:0 auto 28px;font-size:19px">From office lunches to family celebrations — bring the bold flavors of {{restaurant.name_short}} to your next gathering.</p>
  <a class="btn btn--lg" href="Location.html#contact">Contact Us</a>
</section>

<section data-screen-label="Catering menu">
  <div class="wrap center">
    <p class="section-eyebrow" data-reveal>Catering Menu</p>
    <h2 class="section-title" data-reveal>{{pages.catering.offer_h2}}</h2>
    <div class="catering-img" data-reveal data-reveal-delay="120">
      <img src="{{media.catering_menu}}" alt="{{restaurant.name}} catering menu">
    </div>
  </div>
</section>

{{> footer}}
</body>
</html>
